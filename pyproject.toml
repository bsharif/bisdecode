[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bisdecode"
version = "0.1.0"
description = "Decode Aspect/Covidien/Medtronic BIS Advance/Vista data-download files (processed trend, spectrogram, raw EEG) to tidy CSV/NumPy."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "BIS-data project" }]
keywords = ["BIS", "EEG", "anaesthesia", "depth of anaesthesia", "bispectral index", "physiological signals"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["numpy>=1.21", "pandas>=1.3"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/bsharif/bisdecode"
Issues = "https://github.com/bsharif/bisdecode/issues"

[project.scripts]
bisdecode = "bisdecode.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bisdecode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
