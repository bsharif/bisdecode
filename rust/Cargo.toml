[package]
name = "bisdecode-wasm"
version = "0.1.3"
edition = "2021"
license = "MIT"
description = "Rust core of bisdecode, compiled to WebAssembly for in-browser decoding (spike)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
